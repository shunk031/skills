name: CI

# No workflow-level path filters: a skipped required check can stay pending and
# block merges. Jobs decide what to do instead.
#
# `pull_request` carries no branch filter on purpose. Filtering it to `main`
# would silently give stacked pull requests no CI at all, because their base is
# the branch below them rather than `main`.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Runs the same offline pre-commit hooks developers run.
  gate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v3
        with:
          cache: true

      - name: Run offline gates
        run: make gate

  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v3
        with:
          cache: true

      - name: Validate skill layout and eval schemas
        run: make validate

  test:
    # macOS is here for the shell tests, not for coverage. It ships Bash 3.2,
    # and a script that uses a Bash 4 feature runs fine on Linux and dies on the
    # machine an agent actually works on. That is how a `declare -A` reached
    # this repository unnoticed.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v3
        with:
          cache: true

      - name: Report the Bash the shell tests will use
        run: bash --version | head -1

      - name: Run unit tests
        run: make test

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v3
        with:
          cache: true

      - name: Run `shfmt`
        run: make format

      # Same file set `ludeeus/action-shellcheck` checked with default inputs:
      # shell-named files, plus extensionless executables with a shell shebang,
      # each linted on its own.
      - name: Run ShellCheck
        shell: bash
        run: |
          {
            find . ! -path '*./.git/*' ! -path '*.go' ! -path '*/mvnw' -type f \
              '(' -name '*.sh' -o -name '*.bash' -o -name '.bashrc' -o -name 'bashrc' \
              -o -name '.bash_aliases' -o -name '.bash_completion' -o -name '.bash_login' \
              -o -name '.bash_logout' -o -name '.bash_profile' -o -name 'bash_profile' \
              -o -name '*.ksh' -o -name 'suid_profile' -o -name '*.zsh' -o -name '.zlogin' \
              -o -name 'zlogin' -o -name '.zlogout' -o -name 'zlogout' -o -name '.zprofile' \
              -o -name 'zprofile' -o -name '.zsenv' -o -name 'zsenv' -o -name '.zshrc' \
              -o -name 'zshrc' -o -path '*/.profile' -o -path '*/profile' -o -name '*.shlib' \
              ')' -print0
            find . ! -path '*./.git/*' ! -path '*.go' ! -path '*/mvnw' \
              -type f ! -name '*.*' -perm /111 -print0 |
              while IFS= read -r -d '' f; do
                if head -n1 "$f" | grep -Eqs '^#! */[^ ]*/(env *)?[abk]*sh'; then
                  printf '%s\0' "$f"
                fi
              done
          } | xargs -0 -r -t -n1 shellcheck --format=gcc
