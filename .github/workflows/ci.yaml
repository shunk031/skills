name: CI

# No workflow-level path filters: a skipped required check can stay pending and
# block merges. Jobs decide what to do instead.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Runs the same offline pre-commit hooks developers run, minus the two gates
  # that make live Codex calls. Those need a real credential and a real sandbox,
  # so they stay in pre-commit and never run on a hosted runner.
  gate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v3
        with:
          cache: true

      - name: Run offline gates
        run: make gate
        env:
          SKIP: shuhari-check-trigger,shuhari-eval-skill

  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v3
        with:
          cache: true

      - name: Validate skill layout and eval schemas
        run: make validate

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Run `shfmt`
        uses: reviewdog/action-shfmt@v1
        with:
          shfmt_flags: -i 4 -sr -d

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
