name: Docs

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Builds on every pull request so a broken link fails review rather than
  # deployment. `--strict` is what makes that a failure instead of a warning.
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v3
        with:
          cache: true

      - name: Build the documentation site
        run: make docs-build

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    # Only from main. A pull request builds to prove it can; publishing is what
    # merging decides.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
