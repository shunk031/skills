# Minimum mise version compatible with this repository's configuration.
min_version = "2026.8.2"

[tools]
# Keep each group sorted by package name, ignoring backend prefixes.

# Language runtimes. `go` builds the Shuhari gate binary below, and `node` backs
# the textlint pre-commit hook.
go = "1.26.5"
node = "lts"

# Aqua tools
"aqua:j178/prek" = "0.4.11"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:mvdan/sh" = "3.13.1"

# Go tools
#
# Shuhari has no tagged release yet, so this pins the module-proxy pseudo-version
# for the current `main` commit. `mise` cannot resolve `latest` for a module with
# an empty version list, and a floating spec would not be reproducible anyway.
# Replace this with the semantic version once Shuhari cuts one.
"go:github.com/shunk031/shuhari/cmd/shuhari" = "0.0.0-20260824120001-66e997f3e8f2"
